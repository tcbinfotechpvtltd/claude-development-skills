name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Log in as ... 2. Open ... 3. Click ..."
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Local, UAT, Production]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Critical = money or data at risk, or the system is down; High = a key flow blocked; Medium = workaround exists; Low = cosmetic.
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, error messages, request ids. Never paste passwords, tokens or customer personal data.
